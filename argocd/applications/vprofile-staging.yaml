apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vprofile-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AmmanSajid1/vprofile-gitops.git
    targetRevision: main
    path: apps/vprofile/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true