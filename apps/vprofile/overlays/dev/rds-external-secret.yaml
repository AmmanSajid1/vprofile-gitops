apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vprofile-rds
  namespace: dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: vprofile-rds-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: rds!db-17567b02-fbb1-4b10-a3dd-e646753b276e
        property: username

    - secretKey: password
      remoteRef:
        key: rds!db-17567b02-fbb1-4b10-a3dd-e646753b276e
        property: password