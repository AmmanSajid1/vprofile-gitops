apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vprofile-rds
  namespace: dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: vprofile-rds-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: rds!db-87405571-3317-4199-9b2d-14bb1c15399b
        property: username

    - secretKey: password
      remoteRef:
        key: rds!db-87405571-3317-4199-9b2d-14bb1c15399b
        property: password