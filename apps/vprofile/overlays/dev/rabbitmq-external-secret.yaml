apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vprofile-rabbitmq
  namespace: dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: vprofile-rabbitmq-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: vprofile/nonprod/rabbitmq
        property: username

    - secretKey: password
      remoteRef:
        key: vprofile/nonprod/rabbitmq
        property: password