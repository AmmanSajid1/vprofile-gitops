apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vprofile-rds-config
  namespace: dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: vprofile-rds-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JDBC_URL: "jdbc:mysql://{{ .endpoint }}:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull"
  data:
    - secretKey: endpoint
      remoteRef:
        key: /vprofile/nonprod/rds/endpoint