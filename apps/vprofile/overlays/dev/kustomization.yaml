apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - secret-store.yaml
  - rds-external-secret.yaml
  - rabbitmq-external-secret.yaml
patches:
  - path: app-resources.yaml
  - path: rabbitmq-resources.yaml
  - path: memcached-resources.yaml
  - path: app-env.yaml


namespace: dev

replicas:
  - name: vprofile-memcached
    count: 1
  - name: vprofile-rabbitmq
    count: 1
  - name: vprofile-app
    count: 1

images:
  - name: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app
    newTag: 7cfa585b5afed864d12f16909e99a8d0b941be76