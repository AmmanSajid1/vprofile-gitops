apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- ingress.yaml
- secret-store.yaml
- rabbitmq-external-secret.yaml
- mysql-app-external-secret.yaml
- flyway-job.yaml
- mysql-bootstrap-job.yaml
- flyway-service-account.yaml
- mysql-bootstrap-serviceaccount.yaml
- ssm-secret-store.yaml
- rds-config-external-secret.yaml
  
patches:
- path: app-resources.yaml
- path: rabbitmq-resources.yaml
- path: memcached-resources.yaml
- path: app-env.yaml


namespace: dev

replicas:
- count: 1
  name: vprofile-memcached
- count: 1
  name: vprofile-rabbitmq
- count: 1
  name: vprofile-app


images:
- name: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app
  newName: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app
  newTag: b17eb539ba4dc5c3569a8fafca3959b853966d50
- name: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-flyway
  newName: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-flyway
  newTag: b17eb539ba4dc5c3569a8fafca3959b853966d50
