apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

patches:
  - path: app-resources.yaml
  - path: memcached-resources.yaml
  - path: rabbitmq-resources.yaml

namespace: prod

replicas:
  - name: vprofile-app
    count: 2
  - name: vprofile-rabbitmq
    count: 1
  - name: vprofile-memcached
    count: 1

images:
  - name: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app
    newTag: f11d30405b97e347b90239acabd32825891a7fd3

