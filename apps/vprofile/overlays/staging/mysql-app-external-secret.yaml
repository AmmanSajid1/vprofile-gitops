apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: vprofile-mysql-app
  namespace: staging
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: vprofile-mysql-app-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: vprofile/staging/mysql-app
        property: username

    - secretKey: password
      remoteRef:
        key: vprofile/staging/mysql-app
        property: password