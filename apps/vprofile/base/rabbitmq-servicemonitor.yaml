apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vprofile-rabbitmq
  namespace: dev
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - dev
  selector:
    matchLabels:
      app: vprofile-rabbitmq
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s