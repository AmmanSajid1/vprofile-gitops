apiVersion: v1
kind: Service
metadata:
  name: vpromq01
  namespace: dev
  labels:
    app: vprofile-rabbitmq
spec:
  type: ClusterIP
  selector:
    app: vprofile-rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672

    - name: metrics
      protocol: TCP
      port: 15692
      targetPort: 15692