# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-app
spec:
  selector:
    matchLabels:
      app: vprofile-app
  template:
    metadata:
      labels:
        app: vprofile-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: tomcat
        image: 464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app:cfc38bf7f0e5f5dfa6087cfafb850a2e57e9b509
        env:
          - name: JDBC_USERNAME
            valueFrom:
              secretKeyRef:
                name: vprofile-rds-credentials
                key: username

          - name: JDBC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vprofile-rds-credentials
                key: password

          - name: RABBITMQ_USERNAME
            valueFrom:
              secretKeyRef:
                name: vprofile-rabbitmq-credentials
                key: username

          - name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vprofile-rabbitmq-credentials
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
  
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        